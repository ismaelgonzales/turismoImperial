<div class="container mx-auto mt-5 px-4">
    <h2 class="text-2xl font-bold mb-4">Booking Details</h2>
    <div class="overflow-x-auto">
        <table class="w-full border border-gray-300 shadow-lg rounded-lg">
            <thead class="bg-gray-800 text-white">
                <tr>
                    <th class="px-4 py-2 border">Sr No</th>
                    <th class="px-4 py-2 border">Bus Name</th>
                    <th class="px-4 py-2 border">Bus Vehicle No</th>
                    <th class="px-4 py-2 border">Travel Date</th>
                    <th class="px-4 py-2 border">Customer Name</th>
                    <th class="px-4 py-2 border">Email ID</th>
                    <th class="px-4 py-2 border">Seat Numbers</th>
                    <th class="px-4 py-2 border">Vendor ID</th>
                </tr>
            </thead>
            <tbody>
                <tr
                    *ngFor="let item of bookingList(); let i = index; track"
                    class="bg-gray-100 even:bg-gray-200 hover:bg-gray-300">
                    <td class="px-4 py-2 border text-center">{{ i + 1 }}</td>
                    <td class="px-4 py-2 border">{{ item.busName }}</td>
                    <td class="px-4 py-2 border">{{ item.busVehicleNo }}</td>
                    <td class="px-4 py-2 border">
                        {{ item.travelDate | date : 'dd-MMM-yyyy' }}
                    </td>
                    <td class="px-4 py-2 border">{{ item.customerName }}</td>
                    <td class="px-4 py-2 border">{{ item.emailId }}</td>
                    <td class="px-4 py-2 border">
                        <ul class="list-none">
                            <li
                                *ngFor="
                                    let seatno of item.seatNos;
                                    let j = index;
                                    track
                                "
                                class="text-center">
                                {{ seatno }}
                            </li>
                        </ul>
                    </td>
                    <td class="px-4 py-2 border">{{ item.vendorId }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
